name: release

# Run by hand from the Actions tab after the pull request is merged. It runs the C, Python
# and PARI/GP checks, then publishes a GitHub release with the paper files in dist/ and the
# notes in .github/RELEASE_NOTES.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"
      title:
        description: "Release title"
        required: true
        default: "Two conjectures of Wormald on Hamilton cycles in tournaments"

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Install PARI/GP and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp python3-numpy
      - name: C, Python and PARI/GP checks
        run: ./run_all.sh

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the paper files
        run: |
          for f in dist/WormaldHamiltonCycles_final2.pdf \
                   dist/WormaldHamiltonCycles_final2-tex.zip \
                   dist/WormaldHamiltonCycles_final2-arxiv.tar.gz; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" dist/WormaldHamiltonCycles_final2* \
            --target "$TARGET" \
            --title "$TAG: $TITLE" \
            --notes-file .github/RELEASE_NOTES.md
